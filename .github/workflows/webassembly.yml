name: WebAssembly Tiles

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'Makefile'
      - 'build-scripts/build-emscripten.sh'
      - 'build-scripts/prepare-web.sh'
      - 'build-data/web/**'
      - 'data/**'
      - 'src/**'
      - 'gfx/**'
      - '.github/workflows/webassembly.yml'

permissions:
  contents: read

concurrency:
  group: webassembly-tiles
  cancel-in-progress: true

jobs:
  web:
    name: WebAssembly tiles
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config glslang-tools

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@d233ac12b0102f74ca199f5dad7a4e2c13a8a745 # v13
        with:
          version: latest
          no-cache: true

      - name: Cache Emscripten SDL3 stack
        id: sdl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.workspace }}/sdl3_prefix
          key: emscripten-sdl3-3.4.16-image-3.4.6-ttf-3.2.2-freetype-2.14.3-${{ runner.os }}-v2

      - name: Build SDL3 stack for WebAssembly
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          PREFIX="$RUNNER_WORKSPACE/sdl3_prefix"
          export EMSCRIPTEN_SDL_PREFIX="$PREFIX"
          export CMAKE_PREFIX_PATH="$PREFIX"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"

          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git sdl3_src
          emcmake cmake -S sdl3_src -B sdl3_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF
          emmake cmake --build sdl3_build -j"$(nproc)"
          emmake cmake --install sdl3_build

          git clone --depth 1 --branch release-3.4.6 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_image.git sdl3_image_src
          emcmake cmake -S sdl3_image_src -B sdl3_image_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DSDL3_DIR="$PREFIX/lib/cmake/SDL3" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DSDLIMAGE_VENDORED=ON \
            -DSDLIMAGE_DEPS_SHARED=OFF \
            -DSDLIMAGE_STRICT=ON \
            -DSDLIMAGE_PNG=ON \
            -DSDLIMAGE_JPG=OFF \
            -DSDLIMAGE_AVIF=OFF \
            -DSDLIMAGE_JXL=OFF \
            -DSDLIMAGE_TIF=OFF \
            -DSDLIMAGE_WEBP=OFF \
            -DSDLIMAGE_QOI=OFF \
            -DSDLIMAGE_SVG=OFF \
            -DSDLIMAGE_TESTS=OFF \
            -DSDLIMAGE_SAMPLES=OFF
          emmake cmake --build sdl3_image_build -j"$(nproc)"
          emmake cmake --install sdl3_image_build

          git clone --depth 1 --branch release-3.2.2 --recurse-submodules --shallow-submodules https://github.com/libsdl-org/SDL_ttf.git sdl3_ttf_src
          emcmake cmake -S sdl3_ttf_src -B sdl3_ttf_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -DSDL3_DIR="$PREFIX/lib/cmake/SDL3" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DSDLTTF_VENDORED=ON \
            -DSDLTTF_STRICT=ON \
            -DSDLTTF_PLUTOSVG=OFF \
            -DSDLTTF_TESTS=OFF \
            -DSDLTTF_SAMPLES=OFF
          emmake cmake --build sdl3_ttf_build -j"$(nproc)"
          emmake cmake --install sdl3_ttf_build

          git clone --depth 1 --branch VER-2-14-3 https://github.com/freetype/freetype.git freetype_src
          emcmake cmake -S freetype_src -B freetype_build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_HARFBUZZ=ON \
            -DFT_DISABLE_BZIP2=ON \
            -DFT_DISABLE_PNG=ON \
            -DFT_DISABLE_ZLIB=ON \
            -DFT_DISABLE_BROTLI=ON
          emmake cmake --build freetype_build -j"$(nproc)"
          emmake cmake --install freetype_build

      - name: Fetch browser tileset
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/I-am-Erk/CDDA-Tilesets.git tilesets
          git -C tilesets sparse-checkout set gfx/UltimateCataclysm
          mkdir -p gfx
          cp -R tilesets/gfx/UltimateCataclysm gfx/UltimateCataclysm

      - name: Build WebAssembly
        env:
          EMSCRIPTEN_SDL_PREFIX: ${{ runner.workspace }}/sdl3_prefix
          PKG_CONFIG_PATH: ${{ runner.workspace }}/sdl3_prefix/lib/pkgconfig
          CMAKE_PREFIX_PATH: ${{ runner.workspace }}/sdl3_prefix
        run: |
          ./build-scripts/build-emscripten.sh
          ./build-scripts/prepare-web.sh

      - name: Upload web bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cdda-web
          path: build/
          if-no-files-found: error
